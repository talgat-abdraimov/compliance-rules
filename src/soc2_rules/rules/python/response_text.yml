rules:
  - id: soc2-logging.python.no-response-text-in-logs
    languages: [python]
    severity: ERROR
    metadata:
      family: response-text
    message: >-
      Raw response body (.text/.content) in a log call. SOC2: third-party
      responses embed user data (addresses, emails, account info). Log the
      status and an opaque request id instead: logger.error('upstream failed',
      status_code=response.status_code, request_id=request_id).
    patterns:
      - pattern-inside: $LOG.$METHOD(...)
      - metavariable-regex:
          metavariable: $LOG
          regex: ^(.*\.)?(logger|logging|log)$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(trace|debug|info|success|warning|warn|error|exception|critical|fatal|log|bind)$
      - pattern-not-inside: len(...)
      - pattern-either:
          - pattern: $R.text
          - pattern: $R.content
