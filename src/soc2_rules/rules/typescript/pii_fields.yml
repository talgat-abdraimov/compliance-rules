# PII_DENYLIST: email|phone|address|first_name|last_name|full_name|dob|birth|card|pan|cvv|iban|account_number|ssn|passport|national_id|passport_id|tax_id|client_ip|ip_address|sender|subject|snippet|body|lat|lon|lng|latitude|longitude
rules:
  - id: soc2-logging.typescript.no-pii-fields-in-logs
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      family: pii-fields
    message: >-
      PII-named value in a log call (denylist: email, phone, address, names, dob,
      card data, ssn, passport, ip, sender/subject/snippet/body, coordinates).
      SOC2: logs must carry no personal data. Log the opaque record id instead,
      e.g. console.log('sent', { emailId: message.emailId }). Names ending in
      Id/_id, Count, Hash, Masked or Verified are allowed; identity documents
      (nationalId, passportId, taxId) are not.
    patterns:
      # $LOG covers console as well as logger/log aliases, so every branch below
      # binds the same two metavariables and the denylist is defined once.
      - pattern-either:
          - patterns:
              - pattern: $LOG.$METHOD(..., $V, ...)
              # A log message that happens to equal a denylist word is not a leak.
              - metavariable-regex:
                  metavariable: $V
                  regex: ^[^"']
          - patterns:
              - pattern-inside: $LOG.$METHOD(...)
              - pattern: "`...${$V}...`"
          - patterns:
              - pattern-inside: $LOG.$METHOD(...)
              - pattern: "{..., $V, ...}"
          - patterns:
              - pattern-inside: $LOG.$METHOD(...)
              - pattern: "{..., $X: $V, ...}"
              # A quoted constant is a literal, not the user's data.
              - metavariable-regex:
                  metavariable: $V
                  regex: ^[^"']
      - metavariable-regex:
          metavariable: $V
          regex: ^["']?(?:[\w$]+\.)*(?:(?:(?:\w+_)*|(?:\w*[a-z0-9](?=[A-Z])))(?:[nN]ational_?[iI]d|[pP]assport_?[iI]d|[tT]ax_?[iI]d)|(?!(?:has|is|any|num|only|show|use|allow|with)(?:_|[A-Z]))(?!\w*(?:_|(?<=[a-z0-9]))(?:[iI]ds?|[cC]ount|[lL]en|[lL]ength|[sS]ize|[bB]ytes|[tT]ype|[kK]ind|[sS]tatus|[dD]omain|[hH]ash|[mM]asked|[rR]edacted|[vV]erified|[pP]resent|[eE]xists|[eE]nabled|[fF]lag|[sS]core)$)(?:(?:(?:\w+_)*|(?:\w*[a-z0-9](?=[A-Z])))(?:(?:[pP]hone|[aA]ddress|[cC]ard|[bB]irth|[pP]assport|[sS]sn|SSN)\w*|[eE]mail|[fF]irst_?[nN]ame|[lL]ast_?[nN]ame|[fF]ull_?[nN]ame|[dD]ob|DOB|[pP]an|PAN|[cC]vv|CVV|[iI]ban|IBAN|[aA]ccount_?[nN]umber|[sS]ender|[sS]ubject|[sS]nippet|[bB]ody|[lL]atitude|[lL]ongitude|[cC]lient_?[iI][pP]|[iI][pP]_?[aA]ddress)|lat|lon|lng|Lat|Lon|Lng))["']?$
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(console|(.*\.)?_*(logger|log))$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(log|info|warn|error|debug|trace|fatal|verbose|http|silly|child|table|dir)$
