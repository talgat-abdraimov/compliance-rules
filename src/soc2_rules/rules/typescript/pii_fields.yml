# PII_DENYLIST: email|phone|address|first_name|last_name|full_name|dob|birth\w*|card\w*|pan|cvv|iban|account_number|ssn|passport|national_id|client_ip|ip_address|sender|subject|snippet|body|lat|lon
rules:
  - id: soc2-logging.typescript.no-pii-fields-in-logs
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      family: pii-fields
    message: >-
      PII-named value in a log call (denylist: email, phone, address, names, dob,
      card data, ssn, ip, sender/subject/snippet/body, lat/lon). SOC2: logs must
      carry no personal data. Log the opaque record id instead, e.g.
      console.log('sent', { emailId: message.emailId }). Names ending in Id/_id
      are always allowed.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: console.$METHOD(..., $ARG, ...)
                  - patterns:
                      - pattern: $LOG.$METHOD(..., $ARG, ...)
                      - metavariable-regex:
                          metavariable: $LOG
                          regex: ^(.*\.)?(logger|log)$
              - metavariable-regex:
                  metavariable: $ARG
                  regex: (?i)^([\w$]+\.)*\w*?(email|phone|address|first_?name|last_?name|full_?name|dob|birth\w*|card\w*|pan|cvv|iban|account_?number|ssn|passport|national_?id|client_?ip|ip_?address|sender|subject|snippet|body|lat|lon)$
          - patterns:
              - pattern-either:
                  - pattern: console.$METHOD(...)
                  - patterns:
                      - pattern: $LOG.$METHOD(...)
                      - metavariable-regex:
                          metavariable: $LOG
                          regex: ^(.*\.)?(logger|log)$
              - pattern-either:
                  - pattern-regex: \$\{[^}]*\b(?i:email|phone|address|first_?name|last_?name|full_?name|dob|birth\w*|card\w*|pan|cvv|iban|account_?number|ssn|passport|national_?id|client_?ip|ip_?address|sender|subject|snippet|body|lat|lon)(?!\w*_?[iI]d\b)[^}]*\}
                  - pattern-regex: "[{,]\\s*(?i:email|phone|address|first_?name|last_?name|full_?name|dob|birth\\w*|card\\w*|pan|cvv|iban|account_?number|ssn|passport|national_?id|client_?ip|ip_?address|sender|subject|snippet|body|lat|lon)\\s*:"
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(log|info|warn|error|debug|trace|fatal)$
