rules:
  - id: soc2-logging.typescript.no-object-dumps-in-logs
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      family: console-objects
    message: >-
      Whole object in a log call (user/payload/session/data/event/req.body, a
      spread, JSON.stringify, console.table/dir). SOC2: full objects carry PII
      and tokens. Log the specific opaque fields instead, e.g.
      console.log('checkout started', user.id).
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $LOG.$METHOD(..., $OBJ, ...)
              - metavariable-regex:
                  metavariable: $OBJ
                  regex: ^(?:[\w$]+\.)*(?:user|payload|session|data|event|body|req|request|ctx)$
          - patterns:
              - pattern-inside: $LOG.$METHOD(...)
              - pattern: "{..., ...$OBJ, ...}"
              - metavariable-regex:
                  metavariable: $OBJ
                  regex: ^(?:[\w$]+\.)*(?:user|payload|session|data|event|body|req|request|ctx)$
          - patterns:
              - pattern-inside: $LOG.$METHOD(...)
              - pattern: JSON.stringify($OBJ, ...)
              - pattern-not: JSON.stringify({...}, ...)
          # table/dir dump whatever they are handed, whatever it is named.
          - patterns:
              - pattern: $LOG.$METHOD(...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(table|dir)$
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(console|(.*\.)?_*(logger|log))$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(log|info|warn|error|debug|trace|fatal|verbose|http|silly|child|table|dir)$
