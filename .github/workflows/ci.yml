name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: just sync
      - run: just check

  smoke:
    name: Consumer install (lowest supported python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: just smoke
