- id: soc2-logging
  name: SOC2 logging compliance (no PII/tokens/payloads in logs)
  entry: soc2-logging
  language: python
  types_or: [python, ts, tsx, javascript, jsx]
  # semgrep ignores --exclude for explicitly passed filenames, so test/generated
  # paths are filtered here. Keep in sync with EXCLUDED in src/soc2_rules/cli.py.
  exclude: ^(tests?|migrations)/|/(tests?|migrations)/|(^|/)__(tests|snapshots)__/|(^|/)test_[^/]*\.py$|_test\.py$|conftest\.py$|\.(test|spec|stories)\.(ts|tsx|js|jsx)$
  minimum_pre_commit_version: '2.9.0'
