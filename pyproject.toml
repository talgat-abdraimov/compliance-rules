[project]
name = "soc2-rules"
version = "2.0.0"
description = "SOC2 logging-compliance semgrep rule pack"
# pre-commit builds hook environments with its own interpreter, so the floor is
# semgrep's (>=3.10), not the version this repo is developed on.
requires-python = ">=3.10"
dependencies = ["semgrep==1.172.0"]

[project.scripts]
soc2-logging = "soc2_rules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc2_rules"]
